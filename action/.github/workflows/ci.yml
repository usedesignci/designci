# CI for the standalone action repo: the formatter tests run on plain
# `node --test` — this repo deliberately has no dependencies to install.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test '*.test.mjs'
